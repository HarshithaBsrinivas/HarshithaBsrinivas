<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- background -->
  <rect width="760" height="200" rx="14" fill="#5E5550"/>
  <rect y="168" width="760" height="32" rx="6" fill="#4A423E"/>

  <!-- HUD -->
  <g font-family="Courier New, monospace" font-weight="bold">
    <text x="30" y="52" font-size="30" fill="#FFFFFF">× 2.4</text>
    <text x="300" y="52" font-size="34" fill="#FFE14D">1363</text>
    <text x="560" y="52" font-size="30" fill="#FFFFFF">15</text>
    <text x="680" y="52" font-size="30" fill="#FF2E6E">♥</text>
  </g>

  <!-- pixel items -->
  <g shape-rendering="crispEdges">
    <!-- pink flower -->
    <rect x="128" y="62" width="14" height="14" fill="#FF8FB8"/>
    <rect x="142" y="48" width="14" height="14" fill="#FF8FB8"/>
    <rect x="142" y="76" width="14" height="14" fill="#FF8FB8"/>
    <rect x="156" y="62" width="14" height="14" fill="#FF8FB8"/>
    <rect x="142" y="62" width="14" height="14" fill="#FFD166"/>
    <!-- yellow flower -->
    <rect x="220" y="96" width="14" height="14" fill="#FFB020"/>
    <rect x="234" y="82" width="14" height="14" fill="#FFB020"/>
    <rect x="234" y="110" width="14" height="14" fill="#FFB020"/>
    <rect x="248" y="96" width="14" height="14" fill="#FFB020"/>
    <rect x="234" y="96" width="14" height="14" fill="#FFF3A0"/>
    <!-- strawberry -->
    <rect x="62" y="128" width="14" height="14" fill="#C0392B"/>
    <rect x="76" y="128" width="14" height="14" fill="#C0392B"/>
    <rect x="66" y="142" width="14" height="14" fill="#C0392B"/>
    <rect x="62" y="122" width="28" height="6" fill="#3FA34D"/>
    <!-- blue gem -->
    <rect x="394" y="122" width="12" height="12" fill="#4FC3F7"/>
    <rect x="406" y="110" width="8" height="8" fill="#9EE3FF"/>
    <!-- ground pebbles -->
    <rect x="300" y="182" width="6" height="6" fill="#6B615C"/>
    <rect x="460" y="184" width="8" height="6" fill="#6B615C"/>
    <rect x="640" y="180" width="6" height="6" fill="#6B615C"/>
  </g>

  <!-- ground shadow under the blob -->
  <ellipse cx="575" cy="176" rx="56" ry="6" fill="#3B3431"/>

  <!-- the pink blob character (bounces) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="1.6s" repeatCount="indefinite"/>
    <g shape-rendering="crispEdges">
      <!-- outline -->
      <rect x="520" y="110" width="110" height="60" fill="#2B1F2E"/>
      <rect x="540" y="94" width="66" height="20" fill="#2B1F2E"/>
      <!-- body -->
      <rect x="524" y="114" width="102" height="52" fill="#FF2E6E"/>
      <rect x="544" y="98" width="58" height="20" fill="#FF2E6E"/>
      <!-- blue highlights -->
      <rect x="530" y="98" width="14" height="8" fill="#7FD6FF"/>
      <rect x="532" y="122" width="10" height="8" fill="#7FD6FF"/>
      <!-- eyes -->
      <rect x="552" y="128" width="8" height="14" fill="#2B1F2E"/>
      <rect x="598" y="128" width="8" height="14" fill="#2B1F2E"/>
      <!-- mouth -->
      <rect x="572" y="146" width="10" height="4" fill="#2B1F2E"/>
    </g>
  </g>

  <!-- twinkling pixel stars -->
  <g shape-rendering="crispEdges" fill="#FFFFFF">
    <rect x="380" y="80" width="4" height="4">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="700" y="100" width="4" height="4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="450" y="60" width="4" height="4">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="260" y="140" width="4" height="4">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
