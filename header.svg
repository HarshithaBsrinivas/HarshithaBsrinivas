<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2" fill="#F8C8DC"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="900" height="300" rx="24" fill="#FFF4E6"/>
  <rect width="900" height="300" rx="24" fill="url(#dots)" opacity="0.6"/>
  <rect x="10" y="10" width="880" height="280" rx="20" fill="none" stroke="#F4A6C6" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- tag pill -->
  <rect x="60" y="48" width="150" height="30" rx="15" fill="#C0517A"/>
  <text x="135" y="68" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2027 EDITION</text>

  <!-- title -->
  <text x="60" y="130" font-family="Courier New, monospace" font-size="46" font-weight="bold" fill="#B5476F">hi, i'm Harshitha ♡</text>
  <text x="60" y="172" font-family="Courier New, monospace" font-size="22" fill="#E07A9F">developer in progress, dreamer by default.</text>

  <!-- little tags -->
  <text x="60" y="222" font-family="Courier New, monospace" font-size="16" fill="#8A5A6B">✧ CS &amp; Design · class of 2027   ✧ making ideas bloom into software</text>
  <text x="60" y="248" font-family="Courier New, monospace" font-size="16" fill="#8A5A6B">✧ exploring java, AI &amp; full-stack   ✧ somewhere between code, creativity &amp; curiosity</text>

  <!-- potted plant -->
  <g shape-rendering="crispEdges">
    <rect x="536" y="146" width="8" height="44" fill="#7FBF8E"/>
    <rect x="518" y="160" width="18" height="10" fill="#5FA874"/>
    <rect x="544" y="150" width="18" height="10" fill="#5FA874"/>
    <rect x="514" y="190" width="60" height="10" fill="#B5744F"/>
    <rect x="520" y="200" width="48" height="36" fill="#C98B6B"/>
  </g>

  <!-- laptop -->
  <g shape-rendering="crispEdges">
    <rect x="590" y="80" width="220" height="140" fill="#F4A6C6"/>
    <rect x="604" y="94" width="192" height="112" fill="#FFE3EE"/>
    <!-- pixel flower on screen -->
    <rect x="692" y="116" width="16" height="16" fill="#FF8FB8"/>
    <rect x="692" y="148" width="16" height="16" fill="#FF8FB8"/>
    <rect x="676" y="132" width="16" height="16" fill="#FF8FB8"/>
    <rect x="708" y="132" width="16" height="16" fill="#FF8FB8"/>
    <rect x="692" y="132" width="16" height="16" fill="#FFD166"/>
    <rect x="698" y="164" width="4" height="16" fill="#7FBF8E"/>
    <!-- base -->
    <rect x="572" y="220" width="256" height="14" fill="#E07A9F"/>
  </g>

  <!-- mug -->
  <g shape-rendering="crispEdges">
    <rect x="828" y="196" width="40" height="40" fill="#FFD6E6"/>
    <rect x="828" y="196" width="40" height="8" fill="#F4A6C6"/>
    <rect x="868" y="208" width="8" height="20" fill="#FFD6E6"/>
  </g>

  <!-- floating hearts -->
  <text x="560" y="96" font-size="26" fill="#E07A9F">♡
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="820" y="120" font-size="20" fill="#C0517A">♡
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4s" begin="-1.5s" repeatCount="indefinite"/>
  </text>

  <!-- twinkling sparkles -->
  <text x="500" y="110" font-size="24" fill="#F4A6C6">✧
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </text>
  <text x="850" y="62" font-size="22" fill="#FFB86B">✦
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
  </text>
  <text x="470" y="250" font-size="18" fill="#E07A9F">✧
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
